<polyline points="596,68 605,61 616,75 627,61 638,75 646,68"/>
<polyline points="702,68 710,61 720,75 730,61 738,68"/>
<polyline points="814,68 824,61 836,75 848,61 860,75 872,61 884,75 896,61 908,75 920,61 932,75 944,61 956,75 968,61 980,75 992,61 1004,75 1016,61 1028,75 1040,61 1052,75 1064,61 1076,75 1088,61 1100,75 1112,61 1124,75 1136,61 1148,75 1160,61 1172,75 1184,61 1200,68"/>
</g>
<text x="54" y="62" class="panel-label-sm" text-anchor="middle">MADE IN GERMANY</text>
<g id="power-section"><text x="138" y="34" class="panel-label" text-anchor="middle">POWER</text>
<rect x="114" y="42" width="48" height="54" rx="2" fill="#232528" stroke="#4d5157" stroke-width="1.5"/>
<rect id="power-switch" x="120" y="48" width="36" height="42" rx="1.5" fill="#181a1c" filter="url(#dropShadow)"/>
<line x1="121" y1="69" x2="155" y2="69" stroke="#36393f" stroke-width="1.5"/><line x1="138" y1="54" x2="138" y2="61" stroke="#e1e4e8" stroke-width="1.8"/><circle cx="138" cy="79" r="3.5" fill="none" stroke="#e1e4e8" stroke-width="1.6"/></g>
<g id="display-section">
