<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 132" width="1200" height="132">
<defs>
<style>
.logo-quasimidi{font-family:'Arial Black',sans-serif;font-size:16px;font-weight:900;letter-spacing:2px;fill:#151719}
.sub-title{font-family:'Arial Narrow',Arial,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:1.1px;fill:#181a1c}
.panel-label{font-family:'Arial Narrow',Arial,sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.5px;fill:#181a1c}
.panel-label-sm{font-family:'Arial Narrow',Arial,sans-serif;font-size:8.5px;font-weight:700;letter-spacing:.4px;fill:#181a1c}
.circle-text{font-family:'Arial Narrow',Arial,sans-serif;font-size:9.5px;font-weight:700;letter-spacing:1.4px;fill:#181a1c}
</style>
<linearGradient id="brushedMetal" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f0f2f4"/><stop offset="20%" stop-color="#e1e4e8"/><stop offset="55%" stop-color="#d5d8dd"/><stop offset="85%" stop-color="#c8ccd2"/><stop offset="100%" stop-color="#b4b9c0"/></linearGradient>
<radialGradient id="knobGrad" cx="42%" cy="38%" r="62%"><stop offset="0%" stop-color="#4e5156"/><stop offset="75%" stop-color="#222427"/><stop offset="100%" stop-color="#111214"/></radialGradient>
<linearGradient id="lcdGlow" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#65b849"/><stop offset="50%" stop-color="#75cc56"/><stop offset="100%" stop-color="#58a33e"/></linearGradient>
<path id="technoCirclePath" d="M852,70 A42,42 0 1,1 852,70.1"/>
<filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#000" flood-opacity=".4"/></filter>
</defs>
<rect x="0" y="0" width="1200" height="132" rx="4" fill="url(#brushedMetal)" stroke="#8c9199" stroke-width="1.5"/>
<g id="rack-ears">
<rect x="10" y="16" width="16" height="10" rx="5" fill="#1e2022"/><rect x="10" y="106" width="16" height="10" rx="5" fill="#1e2022"/>
<circle cx="62" cy="21" r="7.5" fill="#232528" stroke="#8b9096"/><circle cx="62" cy="111" r="7.5" fill="#232528" stroke="#8b9096"/>
<rect x="1174" y="16" width="16" height="10" rx="5" fill="#1e2022"/><rect x="1174" y="106" width="16" height="10" rx="5" fill="#1e2022"/>
<circle cx="1138" cy="21" r="7.5" fill="#232528" stroke="#8b9096"/><circle cx="1138" cy="111" r="7.5" fill="#232528" stroke="#8b9096"/>
</g>
<g id="zigzag-wave" stroke="#181a1c" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round">
<line x1="0" y1="68" x2="108" y2="68"/>
<polyline points="168,68 178,61 190,75 202,61 214,75 224,68"/>
