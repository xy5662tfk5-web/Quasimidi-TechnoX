<rect x="224" y="38" width="260" height="60" rx="28" fill="#191b1e" stroke="#454950" stroke-width="1.5"/>
<rect x="266" y="47" width="176" height="42" rx="3" fill="url(#lcdGlow)" stroke="#0e1012" stroke-width="2"/>
<text id="lcd-line1" x="354" y="64" font-family="Courier New,monospace" font-size="20" letter-spacing="1.4" fill="#142605" text-anchor="middle">TECHNOX</text>
<text id="lcd-line2" x="354" y="82" font-family="Courier New,monospace" font-size="20" letter-spacing="1.4" fill="#142605" text-anchor="middle">001 TechnoBass</text>
<text x="354" y="115" class="sub-title" text-anchor="middle">16 PART MULTITIMBRAL SYNTHESIZER</text></g>
<g id="knob-parameter"><text x="568" y="30" class="panel-label" text-anchor="middle">PARAMETER</text><circle cx="568" cy="68" r="26" fill="url(#knobGrad)" stroke="#111" stroke-width="1.5" filter="url(#dropShadow)"/><circle cx="568" cy="68" r="21" fill="none" stroke="#3c4046" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="568" y1="45" x2="568" y2="57" stroke="#f0f2f5" stroke-width="2.5" stroke-linecap="round"/><text x="568" y="114" class="panel-label" text-anchor="middle">SOUNDGROUP</text></g>
<g id="knob-value"><text x="674" y="30" class="panel-label" text-anchor="middle">VALUE</text><circle cx="674" cy="68" r="26" fill="url(#knobGrad)" stroke="#111" stroke-width="1.5" filter="url(#dropShadow)"/><circle cx="674" cy="68" r="21" fill="none" stroke="#3c4046" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="674" y1="45" x2="674" y2="57" stroke="#f0f2f5" stroke-width="2.5" stroke-linecap="round"/><text x="674" y="114" class="panel-label" text-anchor="middle">SOUND</text></g>
<g id="control-buttons-matrix">
<g id="btn-edit-ok"><text x="756" y="34" class="panel-label-sm" text-anchor="middle">EDIT / OK</text><rect x="744" y="40" width="24" height="14" rx="2" fill="#1b1d20" stroke="#4a4e54" filter="url(#dropShadow)"/></g>
<g id="btn-exit"><text x="794" y="34" class="panel-label-sm" text-anchor="middle">EXIT</text><rect x="782" y="40" width="24" height="14" rx="2" fill="#1b1d20" stroke="#4a4e54" filter="url(#dropShadow)"/></g>
<g id="btn-part-prev"><polygon points="739,87 732,91 739,95" fill="#181a1c"/><rect x="744" y="84" width="24" height="14" rx="2" fill="#1b1d20" stroke="#4a4e54" filter="url(#dropShadow)"/></g>
<g id="btn-part-next"><rect x="782" y="84" width="24" height="14" rx="2" fill="#1b1d20" stroke="#4a4e54" filter="url(#dropShadow)"/><polygon points="811,87 818,91 811,95" fill="#181a1c"/></g>
<text x="775" y="114" class="panel-label-sm" text-anchor="middle">PART / BANK</text></g>
<g id="circular-slogan"><text class="circle-text"><textPath href="#technoCirclePath" startOffset="3%">TECHNO  •  RAVE  •  ELECTRONIC  •</textPath></text></g>
<g id="output-section"><text x="1012" y="30" class="panel-label" text-anchor="middle">VOLUME</text><polygon points="996,42 1028,35 1028,42" fill="#181a1c"/>
<circle id="knob-volume" cx="1012" cy="68" r="18" fill="url(#knobGrad)" stroke="#111" stroke-width="1.2" filter="url(#dropShadow)"/><line x1="1012" y1="52" x2="1012" y2="61" stroke="#f0f2f5" stroke-width="2" stroke-linecap="round"/>
<text x="1064" y="30" class="panel-label" text-anchor="middle">HEADPH.</text><path d="M1058 46 V41 A6 6 0 0 1 1070 41 V46" fill="none" stroke="#181a1c" stroke-width="1.5"/><rect x="1056" y="43" width="3" height="5" rx="1" fill="#181a1c"/><rect x="1069" y="43" width="3" height="5" rx="1" fill="#181a1c"/>
<g id="headphone-jack"><circle cx="1064" cy="68" r="11" fill="#1b1d20" stroke="#7d828a" stroke-width="1.5" filter="url(#dropShadow)"/><circle cx="1064" cy="68" r="7.5" fill="#9ea3aa" stroke="#454950"/><circle cx="1064" cy="68" r="5.2" fill="#0e0f11"/></g></g>
</svg>