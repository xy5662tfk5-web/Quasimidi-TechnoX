name: macOS Intel build
# Research branch verifies raw ROM size, CRC32 and SHA-1 before further analysis.
# Keep the Intel build at four parallel jobs to shorten panel verification turnaround.

on:
  push:
    branches: [ main, feature/part-editor-midi-mass-foundation, feature/basic-mass-synth-midi-audio, research/original-technox-audio-engine ]
  pull_request:
    branches: [ main, feature/performance-manager, research/part-parameter-model-final, feature/part-editor-midi-mass-foundation, research/original-technox-audio-engine ]
  workflow_dispatch:

concurrency:
  group: technox-intel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test lossless MIDI/SysEx parser
        run: python3 -m unittest discover -s tests -v
      - name: Compile and test MCS-51 CPU core (C++17)
        run: c++ -std=c++17 -Wall -Wextra -pedantic -UNDEBUG tests/test_mcs51_core.cpp -o /tmp/test_mcs51_core && /tmp/test_mcs51_core
      - name: Extract timed factory Performance SysEx stream
        run: python3 tools/parse_technox_mid.py TECHNOX.MID --serial-stream-output /tmp/technox_factory_ram_bank.txsb
      - name: Compile and test TechnoX 8032 machine bus (C++17)
        run: c++ -std=c++17 -Wall -Wextra -pedantic -UNDEBUG tests/test_technox_8032_machine.cpp -o /tmp/test_technox_8032_machine && /tmp/test_technox_8032_machine technox_IC4_mx27c1000_v105.bin technox_IC51_nm27c010_v105.bin /tmp/technox_factory_ram_bank.txsb /tmp/technox_external_sound_memory.bin
      - name: Compile and test MIDI control router (C++17)
        if: hashFiles('tests/test_midi_controller.cpp') != ''
        run: c++ -std=c++17 -Wall -Wextra -pedantic tests/test_midi_controller.cpp -o /tmp/test_midi_controller && /tmp/test_midi_controller
      - name: Compile and test M.A.S.S. foundation (C++17)
        if: hashFiles('Source/MASSAudioEngine.h') != ''
        run: c++ -std=c++17 -Wall -Wextra -pedantic tests/test_mass_engine.cpp -o /tmp/test_mass_engine && /tmp/test_mass_engine
      - name: Compile and test SAM9407 bootstrap receiver (C++17)
        run: c++ -std=c++17 -Wall -Wextra -pedantic -UNDEBUG tests/test_sam9407_bootstrap_receiver.cpp -o /tmp/test_sam9407_bootstrap && /tmp/test_sam9407_bootstrap
      - name: Compile and test SAM9407 sample voice backend (C++17)
        run: c++ -std=c++17 -Wall -Wextra -pedantic -UNDEBUG tests/test_sam9407_voice_backend.cpp -o /tmp/test_sam9407_voice_backend && /tmp/test_sam9407_voice_backend
      - name: Compile and test panel edit mailbox (C++17)
        run: c++ -std=c++17 -Wall -Wextra -pedantic -UNDEBUG tests/test_panel_control_events.cpp -o /tmp/test_panel_control_events && /tmp/test_panel_control_events
      - name: Compile and test manual-based panel control map (C++17)
        run: c++ -std=c++17 -Wall -Wextra -pedantic -UNDEBUG tests/test_panel_control_map.cpp -o /tmp/test_panel_control_map && /tmp/test_panel_control_map
      - name: Compile and test IC4 firmware panel event decoder (C++17)
        run: c++ -std=c++17 -Wall -Wextra -pedantic -UNDEBUG tests/test_firmware_panel_events.cpp -o /tmp/test_firmware_panel_events && /tmp/test_firmware_panel_events
      - name: Compile and test panel GPIO input injection (C++17)
        run: c++ -std=c++17 -Wall -Wextra -pedantic -UNDEBUG tests/test_panel_gpio_inputs.cpp -o /tmp/test_panel_gpio_inputs && /tmp/test_panel_gpio_inputs technox_IC4_mx27c1000_v105.bin
      - name: Compile and test Part editor model (C++17)
        if: hashFiles('tests/test_part_model.cpp') != ''
        run: c++ -std=c++17 -Wall -Wextra -pedantic tests/test_part_model.cpp -o /tmp/test_part_model && /tmp/test_part_model
      - name: Compile and test IC51 directory/descriptor decoder (C++17)
        run: c++ -std=c++17 -Wall -Wextra -pedantic tests/test_mass_resource_rom.cpp -o /tmp/test_mass_resource_rom && /tmp/test_mass_resource_rom technox_IC51_nm27c010_v105.bin
      - name: Compile and test Performance layer selection (C++17)
        if: hashFiles('tests/test_performance_layers.cpp') != ''
        run: c++ -std=c++17 -Wall -Wextra -pedantic tests/test_performance_layers.cpp -o /tmp/test_performance_layers && /tmp/test_performance_layers
      - name: Analyze TechnoX v1.05 ROM images
        run: python3 tools/analyze_technox_rom.py --write-descrambled-ic4 build/technox_ic4_descrambled.bin
      - name: Verify IC4 firmware lookup tables against the real ROM
        run: /tmp/test_mass_resource_rom technox_IC51_nm27c010_v105.bin build/technox_ic4_descrambled.bin
      - name: Disassemble reachable TechnoX MCS-51 firmware
        run: python3 tools/disassemble_technox_8051.py --output build/technox_ic4_disassembly.txt
      - name: Disassemble indirect audio/resource command handlers
        run: |
          python3 tools/disassemble_technox_8051.py \
            --entry 0xEB32 --entry 0x000B --entry 0x0013 --entry 0x001B \
            --entry 0x1C2B --entry 0x1C61 --entry 0x1EDD \
            --entry 0x224C --entry 0x2301 --entry 0x2374 \
            --output build/technox_ic4_command_handlers.txt
      - name: Print GPIO and MIDI-dispatch firmware windows
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from analyze_technox_rom import descramble_ic4
          from disassemble_technox_8051 import decode
          code = descramble_ic4(Path("technox_IC4_mx27c1000_v105.bin").read_bytes())[:0x10000]
          for start, end in ((0x0440, 0x0460), (0x2840, 0x28A0), (0x2FC0, 0x3060), (0x32C0, 0x3340), (0xA6D0, 0xA7A0), (0x9A00, 0xA050), (0x5700, 0x5A20), (0x58E0, 0x5910), (0x59B0, 0x5B00), (0x5B70, 0x5D20), (0x4100, 0x4190), (0x4250, 0x4470), (0x5670, 0x5700), (0x5E80, 0x5EE0), (0x9960, 0x99C0), (0x9B60, 0x9BE0), (0x4080, 0x40D0), (0x6A40, 0x6A70), (0x7090, 0x70D0), (0xA7B0, 0xA7F0), (0x58D0, 0x5910), (0x6A20, 0x6AA0), (0x6E30, 0x6F20), (0xB530, 0xB600), (0xB5A0, 0xB620), (0xC380, 0xC450), (0xC3C0, 0xC410), (0xEC20, 0xECC0)):
              print(f"\\n=== IC4 0x{start:04X}-0x{end:04X} ===")
              pc = start
              while pc < end:
                  size, mnemonic, raw, _ = decode(code, pc)
                  print(f"{pc:04X}: {' '.join(f'{b:02X}' for b in raw):<8} {mnemonic}")
                  pc += size
          from disassemble_technox_8051 import disassemble
          reachable, _, _ = disassemble(code, [0xEB32, 0x000B, 0x0013, 0x001B], 50000)
          print("\\n=== REACHABLE XDATA POINTER REFERENCES ===")
          for target in (0x2B8F, 0x2B9D, 0x304C, 0x304D, 0x304E, 0x7D95, 0x3702, 0x370A, 0x2FB3, 0x2FB4, 0x3039, 0x303A, 0x3050, 0x3051, 0x7BD4, 0x7BD5, 0x7BD6, 0x7BD7, 0x30E4, 0x30E6, 0x30E7, 0x30E8, 0x7BD4, 0x7BD5, 0x2FB5, 0x2FB6, 0x62CB, 0x62CC, 0x2B90, 0x2B91, 0x2B92, 0x2B93, 0x2B94, 0x2B95, 0x2B96, 0x2B97, 0x2B9A, 0x2B9B, 0x2B9C, 0x2FD7, 0x2FA2, 0x7C17):
              sites = [pc for pc, insn in sorted(reachable.items())
                       if code[pc] == 0x90 and
                       ((code[pc + 1] << 8) | code[pc + 2]) == target]
              print(f"XDATA 0x{target:04X}: " + (", ".join(f"0x{x:04X}" for x in sites) or "no reachable immediate DPTR setup"))
              ordered = sorted(reachable)
              for site in sites:
                  index = ordered.index(site)
                  for nearby in ordered[max(0, index - 2):index + 9]:
                      item = reachable[nearby]
                      print(f"  {nearby:04X}: {item.raw:<8} {item.text}")
          PY
      - name: Upload firmware-loaded external sound memory snapshot
        uses: actions/upload-artifact@v4
        with:
          name: technox-external-sound-memory
          path: /tmp/technox_external_sound_memory.bin
          if-no-files-found: error
          compression-level: 0
      - name: Upload indirect command-handler disassembly
        uses: actions/upload-artifact@v4
        with:
          name: technox-ic4-command-handlers
          path: build/technox_ic4_command_handlers.txt
          if-no-files-found: error
          compression-level: 6
      - name: Upload TechnoX firmware disassembly
        uses: actions/upload-artifact@v4
        with:
          name: technox-ic4-mcs51-disassembly
          path: build/technox_ic4_disassembly.txt
          if-no-files-found: error
          compression-level: 6
      - name: Upload descrambled IC4 research image
        uses: actions/upload-artifact@v4
        with:
          name: technox-ic4-descrambled-research
          path: build/technox_ic4_descrambled.bin
          if-no-files-found: error
          compression-level: 0
      - name: Upload raw IC51 research image
        uses: actions/upload-artifact@v4
        with:
          name: technox-ic51-raw-research
          path: technox_IC51_nm27c010_v105.bin
          if-no-files-found: error
          compression-level: 0
      - name: Analyze opaque Part SysEx bytes
        run: python3 tools/analyze_technox_parts.py TECHNOX.MID --output technox_part_byte_report.json
      - name: Upload Part byte report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technox-part-byte-report
          path: technox_part_byte_report.json
          if-no-files-found: ignore

  build:
    timeout-minutes: 60
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Configure (x86_64)
        run: cmake -S . -B build -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_BUILD_TYPE=Release
      - name: Build plugin formats
        run: cmake --build build --config Release --parallel 4
      - name: Build and run Intel C++ regression tests
        run: |
          cmake --build build --config Release --parallel 4 --target technox_mcs51_core_tests technox_8032_machine_tests technox_firmware_transaction_tests technox_mass_resource_rom_tests technox_basic_audio_backend_tests technox_panel_control_events_tests technox_panel_gpio_input_tests technox_panel_control_map_tests technox_firmware_panel_events_tests technox_sam9407_bootstrap_tests technox_sam9407_voice_backend_tests
          ctest --test-dir build -C Release --output-on-failure
      - name: Verify Catalina (10.15) deployment target
        run: |
          APP="build/QuasimidiTechnoX_artefacts/Release/Standalone/Quasimidi TechnoX Lab.app"
          BIN="$APP/Contents/MacOS/Quasimidi TechnoX Lab"
          echo "Standalone bundle minimum OS:"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist" || true
          echo "Standalone executable build version:"
          xcrun vtool -show-build "$BIN" | tee /tmp/technox-build-version.txt
          grep -q "minos 10.15" /tmp/technox-build-version.txt
      - name: Package Intel plugin formats
        run: |
          cd build/QuasimidiTechnoX_artefacts/Release
          tar -czf "$GITHUB_WORKSPACE/technox-intel-plugins.tar.gz" AU VST3 Standalone
      - name: Upload Intel plugin formats
        uses: actions/upload-artifact@v4
        with:
          name: technox-intel-plugins
          path: technox-intel-plugins.tar.gz
          if-no-files-found: error
          compression-level: 0
