name: Export TechnoX board photo thumbnails

on:
  push:
    branches:
      - temp/technox-board-photo-thumbnails

permissions:
  contents: read

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main branch with original screenshots
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create readable thumbnails and contact sheet
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          source = Path("source")
          output = Path("board-thumbnails")
          output.mkdir(exist_ok=True)
          files = sorted(source.glob("Снимок экрана*.png"))
          if len(files) != 12:
              raise SystemExit(f"Expected 12 board screenshots, found {len(files)}")
          tiles = []
          for index, path in enumerate(files, 1):
              image = Image.open(path).convert("RGB")
              original_size = image.size
              image.thumbnail((3000, 3000), Image.Resampling.LANCZOS)
              image.save(output / f"board_{index:02d}.jpg", quality=94, optimize=True)
              tile = image.copy()
              tile.thumbnail((720, 480), Image.Resampling.LANCZOS)
              tiles.append((path.name, tile, original_size))
          sheet = Image.new("RGB", (3 * 760, 4 * 530), "white")
          draw = ImageDraw.Draw(sheet)
          for i, (name, tile, original_size) in enumerate(tiles):
              x = (i % 3) * 760 + 20
              y = (i // 3) * 530 + 35
              sheet.paste(tile, (x, y))
              draw.text((x, y - 25), f"{i+1:02d} {name} {original_size}", fill="black")
          sheet.save(output / "contact-sheet.jpg", quality=92, optimize=True)
          print(f"Created {len(files)} thumbnails and contact sheet")
          PY
      - name: Upload board thumbnails
        uses: actions/upload-artifact@v4
        with:
          name: technox-board-photo-thumbnails
          path: board-thumbnails/
          if-no-files-found: error
          retention-days: 3
