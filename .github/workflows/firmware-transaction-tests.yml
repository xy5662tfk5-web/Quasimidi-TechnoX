name: Firmware transaction model tests

on:
  push:
    branches:
      - research/original-technox-audio-engine
    paths:
      - "Source/TechnoXFirmwareTransaction.h"
      - "tests/test_firmware_transaction.cpp"
      - ".github/workflows/firmware-transaction-tests.yml"
  pull_request:
    paths:
      - "Source/TechnoXFirmwareTransaction.h"
      - "tests/test_firmware_transaction.cpp"
      - ".github/workflows/firmware-transaction-tests.yml"

jobs:
  transaction-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile transaction model tests
        run: c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -ISource tests/test_firmware_transaction.cpp -o firmware-transaction-tests
      - name: Run transaction model tests
        run: ./firmware-transaction-tests
