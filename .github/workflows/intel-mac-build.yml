name: Intel Mac build and tests

on:
  push:
    branches:
      - "research/**"
  pull_request:
    branches:
      - "research/**"
  workflow_dispatch:

jobs:
  intel-macos:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Configure x86_64 build
        run: cmake -S . -B build -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build AU, VST3, Standalone and tests
        run: cmake --build build --config Release --parallel 3

      - name: Run dependency-free tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Upload Intel Mac plugin builds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Quasimidi-TechnoX-Intel-macOS
          path: |
            build/QuasimidiTechnoX_artefacts/Release/Standalone/**
            build/QuasimidiTechnoX_artefacts/Release/AU/**
            build/QuasimidiTechnoX_artefacts/Release/VST3/**
          if-no-files-found: error
          retention-days: 14
